openapi: 3.0.3
info:
  title: typing-app API
  version: "0.1.0"
  description: |
    P2 基本設計(BD-003)。各エンドポイントの description に対応 FR-ID / 画面ID を記載する。
    リアルタイムのローマ字判定(FR-02/FR-03)はフロントエンド完結のため API を持たない(ADR-002)。
  x-doc-id: BD-003
  x-status: fixed
  x-updated: "2026-08-26"

paths:
  /api/users:
    post:
      operationId: identifyUser
      summary: 利用者を識別する(S-01)
      description: |
        FR-12。名前で利用者を検索し、存在しなければ新規作成する(find-or-create)。
        name は前後の空白を trim してから比較・保存する(大文字・小文字は区別する)。
        trim 後に空文字、または101文字以上の場合は400(NFR-09)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "200":
          description: 既存または新規作成した利用者。find-or-create のため新規作成時も 200 を返す
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/topic-sets:
    get:
      operationId: listTopicSets
      summary: お題セット(難易度)一覧を取得する(S-02)
      description: FR-13。難易度選択の選択肢を返す。
      responses:
        "200":
          description: お題セット一覧(sort_order 順)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicSet"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/topic-sets/{topicSetId}/sentences:
    get:
      operationId: listSentences
      summary: 指定したお題セットの全お題文を取得する(S-02→S-03)
      description: |
        FR-01, FR-13。セッション開始時に1回だけ呼ぶ。以降のお題の切り替え(ローテーション・再利用含む)は
        フロントエンドがこの一覧をもとにローカルで行う(ADR-002: タイピング中はバックエンド通信を発生させない)。
      parameters:
        - name: topicSetId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: お題文一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sentence"
        "404":
          description: 指定したお題セットが存在しない、またはお題が0件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/sessions:
    post:
      operationId: submitSession
      summary: セッション結果を送信し、集計・保存する(S-03→S-04)
      description: |
        FR-04, FR-05, FR-06, FR-07。フロントエンドが確定させた正誤ログ(ミス記録含む)を受け取り、
        バックエンド(typing-core)が Net/Raw KPM・正確率・Consistency を算出して保存する。
        総キー入力数(ミス含む)は `correctKeyCount + missRecords.length` として算出する
        (requirements.md FR-06 未決事項への回答)。
        打鍵間隔(keystrokeIntervalsMs)は算出にのみ使い、永続化しない(table-definition.md TBL-04 参照)。
        保存は1トランザクションで行い、失敗時は部分保存しない(NFR-09)。

        次の場合は400: `endConditionType=sentence_count` のとき `endConditionValue` が1〜50の範囲外、
        `time_limit` のとき10〜600(秒)の範囲外。`durationSeconds` が1未満。
        `missRecords[].kana` が `kanaCounts` のいずれの `kana` にも一致しない(分母が存在しないミス記録)。
        次の場合は404: `userId` または `topicSetId` が存在しない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionSubmission"
      responses:
        "201":
          description: 算出・保存結果(自己ベスト比較を含む。S-04 表示用)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/users/{userId}/sessions:
    get:
      operationId: listSessionHistory
      summary: 練習履歴を新しい順に取得する(S-05)
      description: FR-08。userId が存在しない場合は404。
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: セッション結果一覧(played_at 降順)。0件の場合は空配列(screen-design.md 4章 B2)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/users/{userId}/best:
    get:
      operationId: getPersonalBest
      summary: 難易度別の自己ベストを取得する(S-05)
      description: FR-09。指定した難易度(topicSetId)の KPM 最大・正確率最大を返す(難易度をまたいだ集計は行わない)。userId または topicSetId が存在しない場合は404。
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: topicSetId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: |
            自己ベスト。該当難易度のセッション結果が0件の場合、netKpmBest / accuracyBest は null
            (screen-design.md 4章 B2)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/users/{userId}/miss-analysis:
    get:
      operationId: getMissAnalysis
      summary: ミスの傾向分析と改善アドバイスを取得する(S-06)
      description: |
        FR-10, FR-11。全期間・全難易度のミス記録(miss_records)とかな出現回数(session_kana_counts)を
        集計する。セッション自体が0件の場合、4種の集計はすべて空配列、advice は null。
        セッションはあるがミス記録が0件の場合、byKana / byErrorPattern / byPrevKana は空配列にするが、
        byCharType はミスなし(全文字種 accuracyRate=100)として算出する
        (screen-design.md 4章 B2)。userId が存在しない場合は404。
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: ミス傾向分析結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissAnalysis"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  responses:
    ServerError:
      description: DB接続断等のサーバー内部エラー(NFR-09。全エンドポイント共通で一様に返す)。フロントエンドは汎用エラー表示に切り替える
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: リクエストの値が不正(必須項目欠落・値域外・enum外・整合性違反。NFR-09)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 指定した userId 等のリソースが存在しない(NFR-09)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      description: 全エンドポイント共通のエラーボディ(NFR-07)
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          description: HTTPステータスコード
        code:
          type: string
          description: エラー種別を識別する内部コード(例 VALIDATION_ERROR, USER_NOT_FOUND, INTERNAL_ERROR)
        message:
          type: string
        traceId:
          type: string
          description: リクエストごとに発行する一意な文字列。障害調査時にログと突き合わせる(nonfunctional-design.md NFR-07)

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    TopicSet:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true

    Sentence:
      type: object
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
          description: 日本語表記(かな漢字混じり)。FR-01 の表示に使う
        reading:
          type: string
          description: かな読み。フロントエンドの判定エンジンの入力になる

    MissRecordInput:
      type: object
      required: [kanaOccurrenceNo, kana, expectedKey, actualKey, charType]
      properties:
        kanaOccurrenceNo:
          type: integer
          description: 同一セッション内で、`kana` と同じかなが何回目に出現したかの連番(かなの種類ごとに1から数え直す。table-definition.md TBL-05)
        kana:
          type: string
        expectedKey:
          type: string
          description: |
            期待していたキー。FR-02 により1つのかなに複数の受理表記(例: し→si/shi/ci)がありうるため、
            複数候補があるときにどの表記由来のキーを記録するかは P3 `logic-spec/romaji-automaton.md`
            の受理表確定と合わせて定める(未決事項。table-definition.md TBL-05 参照)
        actualKey:
          type: string
        prevKana:
          type: string
          nullable: true
        charType:
          type: string
          enum: [清音, 拗音, 撥音ん, 促音っ, 長音]

    KanaCountInput:
      type: object
      required: [kana, charType, totalCount]
      properties:
        kana:
          type: string
        charType:
          type: string
          enum: [清音, 拗音, 撥音ん, 促音っ, 長音]
        totalCount:
          type: integer

    SessionSubmission:
      type: object
      required: [userId, topicSetId, endConditionType, endConditionValue, correctKeyCount, durationSeconds, keystrokeIntervalsMs, missRecords, kanaCounts]
      properties:
        userId:
          type: integer
          format: int64
        topicSetId:
          type: integer
          format: int64
        endConditionType:
          type: string
          enum: [sentence_count, time_limit]
          description: S-02で選択した終了条件の種類(FR-05)
        endConditionValue:
          type: integer
          description: 終了条件の値(お題N文のNまたは制限時間の秒数)
        correctKeyCount:
          type: integer
          description: 総正しい確定キー入力数(FR-06 の Net KPM・正確率の分子)
        durationSeconds:
          type: integer
        keystrokeIntervalsMs:
          type: array
          items:
            type: integer
          description: Consistency 算出にのみ使用。保存しない
        missRecords:
          type: array
          items:
            $ref: "#/components/schemas/MissRecordInput"
        kanaCounts:
          type: array
          items:
            $ref: "#/components/schemas/KanaCountInput"

    SessionResult:
      type: object
      properties:
        sessionId:
          type: integer
          format: int64
        netKpm:
          type: number
        rawKpm:
          type: number
        accuracy:
          type: number
          description: 正確率(%、0〜100。table-definition.md TBL-04 と同じ単位)
        consistency:
          type: number
          description: 打鍵間隔のばらつき。統計量の定義(標準偏差か変動係数か)はP3で確定する暫定値
        durationSeconds:
          type: integer
        playedAt:
          type: string
          format: date-time
        previousBest:
          $ref: "#/components/schemas/PersonalBest"
          nullable: true
          description: 今回のセッション以前の、この難易度での自己ベスト(初回の場合 null。screen-design.md 4章 B2)
        isNetKpmBest:
          type: boolean
          description: 今回の netKpm が previousBest.netKpmBest を厳密に上回った場合 true(同値は false)。初回セッション(previousBest が null)は true
        isAccuracyBest:
          type: boolean
          description: 今回の accuracy が previousBest.accuracyBest を厳密に上回った場合 true(同値は false)。初回セッション(previousBest が null)は true

    SessionSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        topicSetName:
          type: string
        endConditionType:
          type: string
          enum: [sentence_count, time_limit]
        endConditionValue:
          type: integer
        playedAt:
          type: string
          format: date-time
        netKpm:
          type: number
        accuracy:
          type: number
        durationSeconds:
          type: integer

    PersonalBest:
      type: object
      properties:
        topicSetId:
          type: integer
          format: int64
        netKpmBest:
          type: number
          nullable: true
        accuracyBest:
          type: number
          nullable: true
          description: 正確率(%、0〜100。table-definition.md TBL-04 と同じ単位)

    MissAnalysis:
      type: object
      properties:
        byKana:
          type: array
          description: FR-10(1) かな1拍別のミス回数・ミス率(多い順)
          items:
            type: object
            properties:
              kana:
                type: string
              missCount:
                type: integer
                description: かな1拍単位のミス回数(同一拍での複数回ミスは1と数える。er-diagram.md 3.1)
              missRate:
                type: number
                description: 拍単位ミス数 ÷ session_kana_counts の該当かなの出現回数合計(%、0〜100)
        byErrorPattern:
          type: array
          description: FR-10(2) 誤りパターン(期待キー→実際キー)別発生回数(多い順)
          items:
            type: object
            properties:
              expectedKey:
                type: string
              actualKey:
                type: string
              count:
                type: integer
        byPrevKana:
          type: array
          description: FR-10(3) 直前のかな1拍別のミス発生率(多い順、分母は近似。er-diagram.md 3.3参照)
          items:
            type: object
            properties:
              prevKana:
                type: string
              missRate:
                type: number
                description: 拍単位ミス数(直前がこのかなだった拍でのミス) ÷ session_kana_counts の該当かなの出現回数合計(近似分母。er-diagram.md 3.3)(%、0〜100)
        byCharType:
          type: array
          description: FR-10(4) 文字種別の正解率
          items:
            type: object
            properties:
              charType:
                type: string
                enum: [清音, 拗音, 撥音ん, 促音っ, 長音]
              accuracyRate:
                type: number
                description: (該当文字種の出現回数合計 − 該当文字種の拍単位ミス数) ÷ 該当文字種の出現回数合計。session_kana_counts と miss_records から算出(%、0〜100)
        advice:
          type: string
          nullable: true
          description: FR-11 改善アドバイス文。分析対象データが0件の場合 null
