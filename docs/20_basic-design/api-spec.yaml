openapi: 3.0.3
info:
  title: typing-app API
  version: "0.1.0"
  description: |
    P2 基本設計(BD-003)。各エンドポイントの description に対応 FR-ID / 画面ID を記載する。
    リアルタイムのローマ字判定(FR-02/FR-03)はフロントエンド完結のため API を持たない(ADR-002)。
  x-doc-id: BD-003
  x-status: draft
  x-updated: "2026-08-23"

paths:
  /api/users:
    post:
      operationId: identifyUser
      summary: 利用者を識別する(S-01)
      description: |
        FR-12。名前で利用者を検索し、存在しなければ新規作成する(find-or-create)。
        同じ名前を入力した場合は同一人物として扱う。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "200":
          description: 既存または新規作成した利用者
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/topic-sets:
    get:
      operationId: listTopicSets
      summary: お題セット(難易度)一覧を取得する(S-02)
      description: FR-13。難易度選択の選択肢を返す。
      responses:
        "200":
          description: お題セット一覧(sort_order 順)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicSet"

  /api/topic-sets/{topicSetId}/sentences:
    get:
      operationId: listSentences
      summary: 指定したお題セットの全お題文を取得する(S-02→S-03)
      description: |
        FR-01, FR-13。セッション開始時に1回だけ呼ぶ。以降のお題の切り替え(ローテーション・再利用含む)は
        フロントエンドがこの一覧をもとにローカルで行う(ADR-002: タイピング中はバックエンド通信を発生させない)。
      parameters:
        - name: topicSetId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: お題文一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sentence"
        "404":
          description: 指定したお題セットが存在しない、またはお題が0件

  /api/sessions:
    post:
      operationId: submitSession
      summary: セッション結果を送信し、集計・保存する(S-03→S-04)
      description: |
        FR-04, FR-05, FR-06, FR-07。フロントエンドが確定させた正誤ログ(ミス記録含む)を受け取り、
        バックエンド(typing-core)が Net/Raw KPM・正確率・Consistency を算出して保存する。
        総キー入力数(ミス含む)は `correctKeyCount + missRecords.length` として算出する
        (requirements.md FR-06 未決事項への回答)。
        打鍵間隔(keystrokeIntervalsMs)は算出にのみ使い、永続化しない(table-definition.md TBL-04 参照)。
        保存は1トランザクションで行い、失敗時は部分保存しない(NFR-09)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionSubmission"
      responses:
        "201":
          description: 算出・保存結果(自己ベスト比較を含む。S-04 表示用)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"
        "500":
          description: DB保存失敗(NFR-09。エラー画面表示に使う)

  /api/users/{userId}/sessions:
    get:
      operationId: listSessionHistory
      summary: 練習履歴を新しい順に取得する(S-05)
      description: FR-08。
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: セッション結果一覧(played_at 降順)。0件の場合は空配列(screen-design.md 4章 B2)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"

  /api/users/{userId}/best:
    get:
      operationId: getPersonalBest
      summary: 難易度別の自己ベストを取得する(S-05)
      description: FR-09。難易度ごとに KPM 最大・正確率最大を返す。
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: topicSetId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: |
            自己ベスト。該当難易度のセッション結果が0件の場合、netKpmBest / accuracyBest は null
            (screen-design.md 4章 B2)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBest"

  /api/users/{userId}/miss-analysis:
    get:
      operationId: getMissAnalysis
      summary: ミスの傾向分析と改善アドバイスを取得する(S-06)
      description: |
        FR-10, FR-11。全期間・全難易度のミス記録(miss_records)とかな出現回数(session_kana_counts)を
        集計する。ミス記録が0件の場合、4種の集計はすべて空配列、advice は null
        (screen-design.md 4章 B2)。
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: ミス傾向分析結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissAnalysis"

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    TopicSet:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true

    Sentence:
      type: object
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
          description: 日本語表記(かな漢字混じり)。FR-01 の表示に使う
        reading:
          type: string
          description: かな読み。フロントエンドの判定エンジンの入力になる

    MissRecordInput:
      type: object
      required: [kanaOccurrenceNo, kana, expectedKey, actualKey, charType]
      properties:
        kanaOccurrenceNo:
          type: integer
          description: セッション内でそのかなが何拍目の出現かの通し番号(table-definition.md TBL-05)
        kana:
          type: string
        expectedKey:
          type: string
        actualKey:
          type: string
        prevKana:
          type: string
          nullable: true
        charType:
          type: string
          enum: [清音, 拗音, 撥音ん, 促音っ, 長音]

    KanaCountInput:
      type: object
      required: [kana, charType, totalCount]
      properties:
        kana:
          type: string
        charType:
          type: string
          enum: [清音, 拗音, 撥音ん, 促音っ, 長音]
        totalCount:
          type: integer

    SessionSubmission:
      type: object
      required: [userId, topicSetId, correctKeyCount, durationSeconds, keystrokeIntervalsMs, missRecords, kanaCounts]
      properties:
        userId:
          type: integer
          format: int64
        topicSetId:
          type: integer
          format: int64
        correctKeyCount:
          type: integer
          description: 総正しい確定キー入力数(FR-06 の Net KPM・正確率の分子)
        durationSeconds:
          type: integer
        keystrokeIntervalsMs:
          type: array
          items:
            type: integer
          description: Consistency 算出にのみ使用。保存しない
        missRecords:
          type: array
          items:
            $ref: "#/components/schemas/MissRecordInput"
        kanaCounts:
          type: array
          items:
            $ref: "#/components/schemas/KanaCountInput"

    SessionResult:
      type: object
      properties:
        sessionId:
          type: integer
          format: int64
        netKpm:
          type: number
        rawKpm:
          type: number
        accuracy:
          type: number
        consistency:
          type: number
        durationSeconds:
          type: integer
        playedAt:
          type: string
          format: date-time
        previousBest:
          $ref: "#/components/schemas/PersonalBest"
          nullable: true
          description: 今回のセッション以前の、この難易度での自己ベスト(初回の場合 null。screen-design.md 4章 B2)
        isNewBest:
          type: boolean

    SessionSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        topicSetName:
          type: string
        playedAt:
          type: string
          format: date-time
        netKpm:
          type: number
        accuracy:
          type: number
        durationSeconds:
          type: integer

    PersonalBest:
      type: object
      properties:
        topicSetId:
          type: integer
          format: int64
        netKpmBest:
          type: number
          nullable: true
        accuracyBest:
          type: number
          nullable: true

    MissAnalysis:
      type: object
      properties:
        byKana:
          type: array
          description: FR-10(1) かな1拍別のミス回数・ミス率(多い順)
          items:
            type: object
            properties:
              kana:
                type: string
              missCount:
                type: integer
              missRate:
                type: number
        byErrorPattern:
          type: array
          description: FR-10(2) 誤りパターン(期待キー→実際キー)別発生回数(多い順)
          items:
            type: object
            properties:
              expectedKey:
                type: string
              actualKey:
                type: string
              count:
                type: integer
        byPrevKana:
          type: array
          description: FR-10(3) 直前のかな1拍別のミス発生率(多い順、分母は近似。er-diagram.md 3.3参照)
          items:
            type: object
            properties:
              prevKana:
                type: string
              missRate:
                type: number
        byCharType:
          type: array
          description: FR-10(4) 文字種別の正解率
          items:
            type: object
            properties:
              charType:
                type: string
                enum: [清音, 拗音, 撥音ん, 促音っ, 長音]
              accuracyRate:
                type: number
        advice:
          type: string
          nullable: true
          description: FR-11 改善アドバイス文。分析対象データが0件の場合 null
